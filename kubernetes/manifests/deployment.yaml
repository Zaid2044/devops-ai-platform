apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-ai-platform
  namespace: ai-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-ai-platform

  template:
    metadata:
      labels:
        app: devops-ai-platform

    spec:
      containers:
        - name: devops-ai-platform

          image: devops-ai-platform:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "250m"